apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: graphql-gateway-canary, namespace: aegisvolt }
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector: { matchLabels: { app: graphql-gateway-canary } }
  strategy:
    canary:
      stableService: graphql-gateway-stable
      canaryService: graphql-gateway-canary
      trafficRouting:
        alb:
          ingress: aegisvolt-private
          rootService: graphql-gateway-stable
          servicePort: 80
      steps:
        - setWeight: 20
        - pause: { duration: 2m }
        - analysis: { templates: [{ templateName: aegisvolt-cloudwatch-health }] }
        - setWeight: 100
  template:
    metadata: { labels: { app: graphql-gateway-canary } }
    spec:
      serviceAccountName: graphql-gateway
      containers:
        - name: app
          image: REPLACE_AT_CD/graphql-gateway@sha256:REPLACE_DIGEST
          command: [node, --import, tsx, apps/graphql-gateway/src/index.ts]
          ports: [{ containerPort: 4000, name: http }]
          envFrom: [{ configMapRef: { name: aegisvolt-runtime } }]
          resources: { requests: { cpu: 150m, memory: 192Mi }, limits: { cpu: "1", memory: 384Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: graphql-gateway-stable, namespace: aegisvolt }
spec: { selector: { app: graphql-gateway-canary }, ports: [{ port: 80, targetPort: http }] }
---
apiVersion: v1
kind: Service
metadata: { name: graphql-gateway-canary, namespace: aegisvolt }
spec: { selector: { app: graphql-gateway-canary }, ports: [{ port: 80, targetPort: http }] }

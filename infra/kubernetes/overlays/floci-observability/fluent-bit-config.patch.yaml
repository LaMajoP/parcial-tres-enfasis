apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-for-fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                 1
        Log_Level             info
        Parsers_File          /fluent-bit/etc/aegisvolt-parsers.conf
    [INPUT]
        Name                  tail
        Path                  /var/log/containers/*_${AEGISVOLT_NAMESPACE}_*.log
        Parser                cri
        Tag                   aegisvolt.*
        Mem_Buf_Limit         10MB
        Skip_Long_Lines       On
    [FILTER]
        Name                  parser
        Match                 aegisvolt.*
        Key_Name              log
        Parser                aegisvolt_json
        Reserve_Data          On
        Preserve_Key          Off
    [FILTER]
        Name                  grep
        Match                 aegisvolt.*
        Regex                 $correlation_id .+
    [FILTER]
        Name                  grep
        Match                 aegisvolt.*
        Regex                 $environment ^${AEGISVOLT_ENV}$
    [FILTER]
        Name                  grep
        Match                 aegisvolt.*
        Regex                 $service_group ^(graphql-gateway|station-reservation|billing-wallet|energy-dispatch)$
    [OUTPUT]
        Name                  cloudwatch_logs
        Match                 aegisvolt.*
        region                ${AWS_REGION}
        endpoint              172.27.0.2
        port                  4566
        tls                   Off
        log_group_name        /aegisvolt/${AEGISVOLT_ENV}/aws-for-fluent-bit
        log_group_template    /aegisvolt/$environment/$service_group
        log_stream_prefix     floci-
        auto_create_group     false
  aegisvolt-parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   Off
    [PARSER]
        Name        aegisvolt_json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
        Time_Keep   On

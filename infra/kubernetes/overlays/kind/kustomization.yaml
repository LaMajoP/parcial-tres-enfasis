# Kind verifica objetos, probes y el controlador Argo. No simula ALB ni
# CloudWatch: se elimina solo el traffic routing AWS de esta variante local.
namespace: aegisvolt-dev
resources: [../dev]
patches:
  - target: { group: argoproj.io, version: v1alpha1, kind: Rollout, name: graphql-gateway }
    patch: |-
      - op: remove
        path: /spec/strategy/canary/trafficRouting
      - op: remove
        path: /spec/strategy/canary/steps/2


  # AEGISVOLT_KIND_FIXES
  # Directorio temporal escribible para Node/tsx y Nginx.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: station-reservation
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: tmp
            mountPath: /tmp
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: billing-wallet
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: tmp
            mountPath: /tmp
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: energy-dispatch
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: tmp
            mountPath: /tmp
  - target:
      group: argoproj.io
      version: v1alpha1
      kind: Rollout
      name: graphql-gateway
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: tmp
            mountPath: /tmp
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: tmp
            emptyDir: {}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: tmp
            mountPath: /tmp
  # CloudWatch se desactiva solamente en Kind.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: aws-for-fluent-bit
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          aegisvolt.io/cloudwatch: enabled

  # KIND_WEB_GRAPHQL_FIX
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: nginx-config
          configMap:
            name: web-nginx
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
          readOnly: true

  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: web-ingress
    patch: |-
      - op: add
        path: /spec/policyTypes/-
        value: Egress
      - op: add
        path: /spec/egress
        value:
          - to:
              - podSelector:
                  matchLabels:
                    app: graphql-gateway
            ports:
              - protocol: TCP
                port: 4000

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: web-nginx
    files:
      - default.conf=nginx.conf

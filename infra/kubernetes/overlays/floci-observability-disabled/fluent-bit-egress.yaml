apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-cloudwatch-egress
spec:
  podSelector:
    matchLabels:
      app: aws-for-fluent-bit
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 172.27.0.2/32
      ports:
        - protocol: TCP
          port: 4566

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt-dev
resources:
  - fluent-bit-base.yaml
  - fluent-bit-egress.yaml
patches:
  - target: { group: apps, version: v1, kind: DaemonSet, name: aws-for-fluent-bit }
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          aegisvolt.io/cloudwatch: enabled

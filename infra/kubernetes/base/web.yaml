apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: aegisvolt, labels: { app: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: REPLACE_AT_CD/web@sha256:REPLACE_DIGEST
          ports: [{ containerPort: 5173, name: http }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          readinessProbe: { httpGet: { path: /, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: aegisvolt }
spec: { selector: { app: web }, ports: [{ name: http, port: 80, targetPort: http }] }

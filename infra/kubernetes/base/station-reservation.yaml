apiVersion: apps/v1
kind: Deployment
metadata: { name: station-reservation, namespace: aegisvolt, labels: { app: station-reservation } }
spec:
  replicas: 2
  selector: { matchLabels: { app: station-reservation } }
  template:
    metadata: { labels: { app: station-reservation, aegisvolt.io/component: domain-service } }
    spec:
      serviceAccountName: station-reservation
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: REPLACE_AT_CD/station-reservation@sha256:REPLACE_DIGEST
          command: [node, --import, tsx, services/station-reservation-service/src/index.ts]
          ports: [{ containerPort: 3001, name: http }]
          envFrom: [{ configMapRef: { name: aegisvolt-runtime } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 20, periodSeconds: 3 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: station-reservation, namespace: aegisvolt }
spec: { selector: { app: station-reservation }, ports: [{ name: http, port: 3001, targetPort: http }] }

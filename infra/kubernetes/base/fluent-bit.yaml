apiVersion: v1
kind: ServiceAccount
metadata:
  name: aws-for-fluent-bit
  namespace: aegisvolt
---
apiVersion: v1
kind: ConfigMap
metadata: { name: aws-for-fluent-bit, namespace: aegisvolt }
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                 1
        Log_Level             info
        Parsers_File          parsers.conf
    [INPUT]
        Name                  tail
        Path                  /var/log/containers/*.log
        Parser                cri
        Tag                   kube.*
        Mem_Buf_Limit         10MB
        Skip_Long_Lines       On
    [FILTER]
        Name                  kubernetes
        Match                 kube.*
        Merge_Log             On
        Keep_Log              Off
        K8S-Logging.Parser    On
    [FILTER]
        Name                  grep
        Match                 kube.*
        Regex                 $kubernetes['namespace_name'] ^aegisvolt-(dev|test|prod)$
    [OUTPUT]
        Name                  cloudwatch_logs
        Match                 kube.*
        region                ${AWS_REGION}
        log_group_template    /aegisvolt/${AEGISVOLT_ENV}/$kubernetes['labels']['app']
        log_stream_template   $kubernetes['pod_name']
        auto_create_group     false
        log_key               log
        extra_user_agent      aegisvolt-fluent-bit
---
apiVersion: apps/v1
kind: DaemonSet
metadata: { name: aws-for-fluent-bit, namespace: aegisvolt, labels: { app: aws-for-fluent-bit } }
spec:
  selector: { matchLabels: { app: aws-for-fluent-bit } }
  template:
    metadata: { labels: { app: aws-for-fluent-bit } }
    spec:
      serviceAccountName: aws-for-fluent-bit
      tolerations: [{ operator: Exists }]
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.32.4
          env:
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: aegisvolt-runtime, key: AWS_REGION } }
            - name: AEGISVOLT_ENV
              valueFrom: { configMapKeyRef: { name: aegisvolt-runtime, key: AEGISVOLT_ENV } }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
          securityContext: { runAsUser: 0, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true }
      volumes:
        - { name: varlog, hostPath: { path: /var/log } }
        - { name: config, configMap: { name: aws-for-fluent-bit } }

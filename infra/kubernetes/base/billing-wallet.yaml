apiVersion: apps/v1
kind: Deployment
metadata: { name: billing-wallet, namespace: aegisvolt, labels: { app: billing-wallet } }
spec:
  replicas: 2
  selector: { matchLabels: { app: billing-wallet } }
  template:
    metadata: { labels: { app: billing-wallet, aegisvolt.io/component: domain-service } }
    spec:
      serviceAccountName: billing-wallet
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: aegisvolt/billing-wallet:0.0.0
          command: [node, --import, tsx, services/billing-wallet-service/src/index.ts]
          ports: [{ containerPort: 3002, name: http }]
          envFrom: [{ configMapRef: { name: aegisvolt-runtime } }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          startupProbe: { httpGet: { path: /health/live, port: http }, failureThreshold: 20, periodSeconds: 3 }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: billing-wallet, namespace: aegisvolt }
spec: { selector: { app: billing-wallet }, ports: [{ name: http, port: 3002, targetPort: http }] }

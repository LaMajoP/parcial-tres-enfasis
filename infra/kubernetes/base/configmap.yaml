apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisvolt-runtime
  namespace: aegisvolt
data:
  AEGISVOLT_ENV: dev
  AWS_REGION: us-east-1
  TABLE_RESERVATIONS: aegisvolt-reservations-dev
  TABLE_BILLING: aegisvolt-billing-dev
  TABLE_DISPATCH: aegisvolt-dispatch-dev
  TABLE_SAGA: aegisvolt-saga-dev
  TABLE_FLAGS: aegisvolt-flags-dev
  # DNS corta: cada overlay vive en un namespace propio y no depende de nameSuffix.
  STATION_SERVICE_URL: http://station-reservation:3001
  BILLING_SERVICE_URL: http://billing-wallet:3002
  DISPATCH_SERVICE_URL: http://energy-dispatch:3003
  # La UI usa /graphql en el mismo ALB privado. Si se habilita un entrypoint
  # público autenticado, el pipeline debe fijar explícitamente su origen antes
  # de exponerlo; este valor seguro no autoriza navegadores externos por defecto.
  WEB_ORIGIN: https://aegisvolt.invalid

name: aegisvolt
services:
  dynamodb-local:
    image: amazon/dynamodb-local:2.5.3
    working_dir: /home/dynamodblocal
    command:
      - "-jar"
      - "DynamoDBLocal.jar"
      - "-sharedDb"
      - "-dbPath"
      - "/home/dynamodblocal/data"
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - aegisvolt
  dynamodb-init:
    build: { context: ., target: runtime }
    user: root
    command: ["node", "--import", "tsx", "scripts/bootstrap-dynamodb.mjs"]
    environment: &aws-local
      AEGISVOLT_ENV: dev
      AWS_REGION: us-east-2
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      DEMO_MODE: "true"
      SEED_DEMO_DATA: "true"
    depends_on: [dynamodb-local]
    networks: [aegisvolt]
  station-reservation-service:
    build: { context: ., target: runtime }
    command: ["node", "--import", "tsx", "services/station-reservation-service/src/index.ts"]
    environment: *aws-local
    depends_on: { dynamodb-init: { condition: service_completed_successfully } }
    ports: ["3001:3001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [aegisvolt]
  billing-wallet-service:
    build: { context: ., target: runtime }
    command: ["node", "--import", "tsx", "services/billing-wallet-service/src/index.ts"]
    environment: *aws-local
    depends_on: { dynamodb-init: { condition: service_completed_successfully } }
    ports: ["3002:3002"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [aegisvolt]
  energy-dispatch-service:
    build: { context: ., target: runtime }
    command: ["node", "--import", "tsx", "services/energy-dispatch-service/src/index.ts"]
    environment: *aws-local
    depends_on: { dynamodb-init: { condition: service_completed_successfully } }
    ports: ["3003:3003"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3003/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [aegisvolt]
  graphql-gateway:
    build: { context: ., target: runtime }
    command: ["node", "--import", "tsx", "apps/graphql-gateway/src/index.ts"]
    environment:
      <<: *aws-local
      STATION_SERVICE_URL: http://station-reservation-service:3001
      BILLING_SERVICE_URL: http://billing-wallet-service:3002
      DISPATCH_SERVICE_URL: http://energy-dispatch-service:3003
      WEB_ORIGIN: http://localhost:5173
      DEMO_AUTH: "true"
    depends_on:
      station-reservation-service: { condition: service_healthy }
      billing-wallet-service: { condition: service_healthy }
      energy-dispatch-service: { condition: service_healthy }
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [aegisvolt]
  web:
    build:
      context: .
      target: web-runtime
      args: { VITE_GRAPHQL_URL: http://localhost:4000/graphql }
    depends_on: { graphql-gateway: { condition: service_healthy } }
    ports: ["5173:8080"]
    healthcheck:
      # En la imagen unprivileged Nginx escucha IPv4; `localhost` resuelve ::1
      # primero y marcaba falso negativo aunque la UI respondiera por el puerto.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aegisvolt]
  prefect:
    image: prefecthq/prefect:3.1.15-python3.12
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    ports: ["4200:4200"]
    environment: { PREFECT_SERVER_API_HOST: 0.0.0.0 }
    volumes: ["./observability/prefect:/opt/aegisvolt/prefect:ro"]
    networks: [aegisvolt]
volumes: { dynamodb-data: {} }
networks: { aegisvolt: { driver: bridge } }
